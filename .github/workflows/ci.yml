name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, stable]

# Um push novo cancela o build anterior do mesmo ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  # push em master -> deploy de PREVIEW (não roda em PR)
  deploy:
    if: github.event_name == 'push'
    needs: checks
    uses: ./.github/workflows/deploy.yml
    with:
      production: false
    secrets: inherit
