name: CI

# push em master  -> checks -> deploy de PRODUÇÃO (app.autoflowcenter.com.br)
# pull request     -> só checks
#
# A Vercel NÃO deploya sozinha (Ignored Build Step = "Don't build anything").
# O build acontece aqui no runner e sobe pré-buildado, então o deploy só
# ocorre depois do job `checks` passar.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master, stable]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# IDs do projeto Vercel (não são segredo — identificam o projeto, não dão acesso).
env:
  VERCEL_ORG_ID: team_Q0ScqjxQdz88nTwHplhdxqx2
  VERCEL_PROJECT_ID: prj_2ni5NI3yCqsiOk1LNodi3kzWvPso

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://app.autoflowcenter.com.br
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Linkar projeto Vercel
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json

      - name: Baixar env de produção
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build de produção
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy pré-buildado -> produção
        run: |
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "Deploy de produção: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Domínio: https://app.autoflowcenter.com.br" >> "$GITHUB_STEP_SUMMARY"
