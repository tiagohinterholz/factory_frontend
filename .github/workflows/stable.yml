name: Stable

# push em stable -> checks -> deploy de HOMOLOGAÇÃO (homolog-app.autoflowcenter.com.br)
#
# Deploy de preview pré-buildado + alias fixo pro domínio de homolog. Só roda
# depois do job `checks` passar. A Vercel não deploya sozinha.
on:
  push:
    branches: [stable]

concurrency:
  group: stable
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: homologacao
      url: https://homolog-app.autoflowcenter.com.br
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Baixar env de preview
        run: vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build de preview
        run: vercel build --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy pré-buildado + alias -> homolog
        run: |
          url=$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}")
          echo "Deploy: $url" >> "$GITHUB_STEP_SUMMARY"
          vercel alias set "$url" homolog-app.autoflowcenter.com.br --token="${{ secrets.VERCEL_TOKEN }}"
          echo "Domínio: https://homolog-app.autoflowcenter.com.br" >> "$GITHUB_STEP_SUMMARY"
