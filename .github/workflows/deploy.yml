name: Deploy

# Deploy na Vercel via CLI. Chamado por ci.yml (preview) e stable.yml (produção).
on:
  workflow_call:
    inputs:
      production:
        description: "true = deploy de produção (--prod); false = preview"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.production && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        id: deploy
        run: |
          if [ "${{ inputs.production }}" = "true" ]; then
            url=$(npx vercel@latest deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}")
          else
            url=$(npx vercel@latest deploy --yes --token="${{ secrets.VERCEL_TOKEN }}")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
